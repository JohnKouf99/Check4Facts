basic:
  model: 'el_core_news_lg'
  lexicon: '../greek_sentiment_lexicon.tsv' #changed it from 'greek_sentiment_lexicon.tsv'
  included_feats: [
    'llm_embeddings' 
    # Comment out `included_feats` below to speed up debbuging, during code developement.
    # 'embedding', 'similarity', 'subjectivity', #'subjectivity_counts',
    # 'sentiment', 'sentiment_counts', 'emotion', 'pg_polarity_counts'
    ]
  included_resource_parts: ['title', 'body', 'sim_par', 'sim_sent']
embeddings: null
llm_embeddings:
  method: 'transformers' #  transformers, ollama, openai 
  transformers:
    model_name: 'nlpaueb/bert-base-greek-uncased-v1'
  ollama:
    model_name: 'ilsp/meltemi-instruct:latest'
  openai:
    model_name: 'text-embedding-3-small'
    api_key: ''
    max_tokens: 8192

similarity: null
subjectivity:
  prefixes: ['subjectivity']
  scores: {'N/A': 0.5, 'OBJ': 0.0, 'SUBJ-': 0.5, 'SUBJ+': 1.0}
  thr: {'OBJ': 0.5, 'SUBJ': 0.5}
sentiment:
  prefixes: ['polarity']
  scores: {'N/A': 0.5, '1': 0.5, 'NEG': 0.0, 'BOTH': 0.5, 'POS': 1.0}
  thr: {'NEG': 0.5, 'POS': 0.5}
emotion:
  prefixes: ['anger', 'disgust', 'fear', 'happiness', 'sadness', 'surprise']
  scores: {'N/A': 0.0, 0: 0.0, 1: 0.0, 2: 0.25, 3: 0.5, 4: 0.75, 5: 1.0}
  thr: 0.0625